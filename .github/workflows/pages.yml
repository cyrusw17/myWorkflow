name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/ai-agent-trading-prompt-2589]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bake-off (refresh site/data)
        run: python -m src.run_bakeoff
        continue-on-error: true

      - name: Ensure bakeoff.json exists
        run: |
          test -f site/data/bakeoff.json || (echo "Missing site/data/bakeoff.json" && exit 1)

      - name: Stage publish tree (root + /site mirrors)
        run: |
          # Actions previously published only site/ → URLs at /.
          # Branch-root legacy build used /site/ and a root redirect to site/.
          # Publish BOTH layouts so neither URL shape 404s after a race.
          mkdir -p public/site/data public/data public/resume public/site/resume
          cp site/*.html public/
          cp site/*.html public/site/
          cp site/data/* public/data/
          cp site/data/* public/site/data/
          # Nested pages (e.g. resume) — flat *.html copy misses these
          if [ -d site/resume ]; then
            cp -R site/resume/. public/resume/
            cp -R site/resume/. public/site/resume/
          fi
          # Keep root lab JSON in sync for local/legacy checkouts too
          cp site/data/*.json data/ 2>/dev/null || true
          touch public/.nojekyll
          ls -la public public/site public/resume public/site/resume | head -50

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
