name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/ai-agent-trading-prompt-2589]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bake-off (refresh site/data)
        run: python -m src.run_bakeoff
        continue-on-error: true

      - name: Ensure bakeoff.json exists
        run: |
          test -f site/data/bakeoff.json || (echo "Missing site/data/bakeoff.json" && exit 1)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
